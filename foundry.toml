[profile.default]
src = "src"
out = "out"
libs = ["lib"]
optimizer = true
optimizer_runs = 1_000

# Pinned for deterministic, cross-chain-safe deployment of the non-upgradeable
# RequestsManagerV2. evm_version is held at "shanghai" (PUSH0, no MCOPY/transient
# opcodes) so the same bytecode is valid on every target chain in DeployV2.s.sol;
# bump to "cancun" only after confirming support on all of them. solc is pinned
# so an immutably-deployed contract is reproducible.
solc = "0.8.28"
evm_version = "shanghai"

# Vendored audited artifacts used by DeployNewProductV2 / DeployAvETHPlusV2 (vm.getCode).
# `out` is required by openzeppelin-foundry-upgrades, which reads build artifacts to run the
# upgrade-safety validator (Deployment.s.sol / Deployment.t.sol).
fs_permissions = [
    { access = "read", path = "script/artifacts" },
    { access = "read", path = "out" },
]

# https://docs.openzeppelin.com/upgrades-plugins/foundry-upgrades
ffi = true
ast = true
build_info = true
extra_output = ["storageLayout"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Used only to RUN the artifact-based deploy scripts (DeployNewProductV2,
# DeployAvETHPlusV2) and their fork tests: lifts the EVM to cancun so the simulator
# accepts the cancun-built vendored artifacts. Deployed bytecode is unaffected — those
# scripts deploy exclusively from script/artifacts/*.json. The target chain must support
# cancun. Formerly named "ink-deploy", before a second chain needed it.
[profile.artifact-deploy]
evm_version = "cancun"

[profile.ci]
